<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sprite sheet</title>
  <style>
    body { margin: 0; background: #2a2440; color: #e6e0ff; font: 12px sans-serif; }
    canvas { image-rendering: pixelated; display: block; }
  </style>
</head>
<body>
  <canvas id="sheet" width="1280" height="1500"></canvas>
  <script type="module">
    import { buildSprites } from '../src/sprites.js';
    const s = buildSprites();
    const cv = document.getElementById('sheet');
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#5a6a8a'; ctx.fillRect(0, 0, cv.width, cv.height);
    let x = 8; let y = 8; let rowH = 0;
    const put = (img, label, scale = 3) => {
      const w = img.width * scale; const h = img.height * scale;
      if (x + w > cv.width - 8) { x = 8; y += rowH + 22; rowH = 0; }
      ctx.drawImage(img, x, y + 14, w, h);
      ctx.fillStyle = '#fff'; ctx.fillText(label, x, y + 10);
      x += w + 10; rowH = Math.max(rowH, h);
    };
    // The procedural sprites still in use: spikes and scenery.
    for (const [k, img] of Object.entries(s.spikes)) put(img, 'spikes ' + k);
    for (const [k, v] of Object.entries(s.decor)) (Array.isArray(v) ? v : [v]).forEach((img, i) => put(img, `${k}${i}`, 2));
    window.sheetDone = true;
  </script>
</body>
</html>
